<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Supervisor or Coordinator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .contact-box { background: #f9f9f9; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .error { color: red; margin-top: 10px; font-weight: bold; }
        .success { color: green; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Assigned Supervisor & Coordinator Contacts</h2>
    <div class="contact-box">
        <p><strong>Supervisor:</strong> [Insert Name] | Email: [Insert Email] | Phone: [Insert Phone]</p>
        <p><strong>Coordinator:</strong> [Insert Name] | Email: [Insert Email] | Phone: [Insert Phone]</p>
    </div>

    <h3>Send Direct Inquiry</h3>
    <form id="inquiryForm">
        <label>Student ID:</label><br>
        <input type="text" id="student_id" required><br><br>

        <label>Recipient Email:</label><br>
        <input type="email" id="recipient_email" required><br><br>

        <label>Message Content:</label><br>
        <textarea id="message_content" rows="4" required></textarea><br><br>

        <button type="submit">Send Inquiry</button>
        <div id="responseMessage"></div>
    </form>

    <script>
        document.getElementById('inquiryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const studentId = document.getElementById('student_id').value.trim();
            const recipientEmail = document.getElementById('recipient_email').value.trim();
            const messageContent = document.getElementById('message_content').value.trim();
            const responseDiv = document.getElementById('responseMessage');

            // Acceptance Criteria: Validate inputs and handle errors
            if (!studentId) {
                responseDiv.className = 'error';
                responseDiv.textContent = 'Error: Invalid or missing student_id.';
                return;
            }

            if (!recipientEmail || !recipientEmail.includes('@')) {
                responseDiv.className = 'error';
                responseDiv.textContent = 'Error: Missing or invalid recipient email.';
                return;
            }

            if (!messageContent) {
                responseDiv.className = 'error';
                responseDiv.textContent = 'Error: Message content cannot be empty.';
                return;
            }

            // If validation passes
            responseDiv.className = 'success';
            responseDiv.textContent = 'Inquiry sent successfully!';
        });
    </script>

</body>
</html>
