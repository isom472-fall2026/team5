<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Requirements</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0f1f3d; color: #fff; }
  header { background: #0a1630; color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
  #menuToggle { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
  .sidebar { position: fixed; top: 0; left: -260px; width: 250px; height: 100%; background: #0a1630; padding: 20px; transition: left .3s; z-index: 20; }
  .sidebar.open { left: 0; }
  .sidebar a { display: block; padding: 10px 0; color: #fff; text-decoration: none; }
  .sidebar a.current { font-weight: bold; color: #8fb3ff; }
  #closeSidebar { background: none; border: none; color: #fff; font-size: 22px; float: right; cursor: pointer; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10; }
  .overlay.active { display: block; }
  main { max-width: 700px; margin: 24px auto; padding: 0 16px; }
  h1 { margin-bottom: 6px; }
  .sub { color: #b8c4dd; margin-bottom: 20px; }
  .card { background: #1a2d52; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .doc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
  .doc-row label { min-width: 140px; font-weight: bold; }
  .doc-row input { color: #b8c4dd; }
  button.submit { background: #3b6fd8; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; margin-top: 8px; }
  button.submit:disabled { background: #44506b; cursor: not-allowed; }
  .ok { background: #163d2a; color: #c9f5d9; border-radius: 10px; padding: 12px; margin-bottom: 16px; }
  .error { background: #5a1a1a; color: #ffd6d6; border-radius: 10px; padding: 12px; margin-bottom: 16px; }
  .msg { margin-top: 10px; font-weight: bold; }
  .msg.good { color: #8ee0a8; }
  .msg.bad { color: #ff9b9b; }
</style>
</head>
<body>

<header>
  <button id="menuToggle">&#9776;</button>
  <strong>Internship Platform</strong>
</header>

<nav class="sidebar" id="sidebar">
  <button id="closeSidebar">&times;</button>
  <a href="navigation-menu.html">Home</a>
  <a href="evaluation-criteria.html">Evaluation Criteria</a>
  <a href="company-requirements.html" class="current">Company Requirements</a>
  <a href="contact-support.html">Contact Support</a>
</nav>
<div class="overlay" id="overlay"></div>

<main>
  <h1>Company Requirements</h1>
  <p class="sub">Upload the required documents before applying.</p>
  <div id="creditBox"></div>
  <div id="content"></div>
</main>

<script>
  const student = { completed_credits: 96 };
  const MIN_CREDITS = 90;

  const place = {
    place_id: 1,
    place_name: "Training Company",
    company_requirements: "Required documents",
    required_documents: ["CV", "Civil ID", "Personal Photo", "GPA"]
  };

  // Check 90 credit units
  const eligible = student.completed_credits >= MIN_CREDITS;
  document.getElementById("creditBox").innerHTML = eligible
    ? `<div class="ok">You have completed ${student.completed_credits} credit units. You meet the minimum of ${MIN_CREDITS} units.</div>`
    : `<div class="error">You have completed ${student.completed_credits} credit units. You need at least ${MIN_CREDITS} units before applying.</div>`;

  // Check required columns
  const missing = [];
  if (!place.place_id) missing.push("place_id");
  if (!place.place_name) missing.push("place_name");
  if (!place.company_requirements) missing.push("company_requirements");
  if (!place.required_documents || place.required_documents.length === 0) missing.push("required_documents");

  const content = document.getElementById("content");
  if (missing.length) {
    content.innerHTML = `<div class="error"><strong>Missing company specifications:</strong> ${missing.join(", ")}</div>`;
  } else {
    const rows = place.required_documents.map(d => `
      <div class="doc-row">
        <label>${d}</label>
        <input type="file" accept=".pdf,.jpg,.jpeg,.png">
      </div>`).join("");
    content.innerHTML = `
      <div class="card">
        ${rows}
        <button class="submit" id="submitBtn" ${eligible ? "" : "disabled"}>Upload</button>
        <div class="msg" id="msg"></div>
      </div>`;

    document.getElementById("submitBtn").addEventListener("click", () => {
      const empty = [...document.querySelectorAll('input[type="file"]')].filter(i => i.files.length === 0);
      const msg = document.getElementById("msg");
      if (empty.length) {
        msg.className = "msg bad";
        msg.textContent = "Please upload all required documents.";
      } else {
        msg.className = "msg good";
        msg.textContent = "Documents uploaded successfully.";
      }
    });
  }

  // Side menu
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");
  function openSidebar() { sidebar.classList.add("open"); overlay.classList.add("active"); }
  function hideSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("active"); }
  document.getElementById("menuToggle").addEventListener("click", openSidebar);
  document.getElementById("closeSidebar").addEventListener("click", hideSidebar);
  overlay.addEventListener("click", hideSidebar);
</script>

</body>
</html>
