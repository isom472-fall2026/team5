<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact supervisor or coordinator | Field Training</title>
  <style>
    :root {
      --navy: #0f1f3d;
      --navy-soft: #33415c;
      --gold: #f2c230;
      --white: #ffffff;
      --line: #e3e8f0;
      --muted: #5a6785;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: var(--white); color: var(--navy); }
    header { background: var(--navy); color: var(--white); padding: 14px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 4px solid var(--gold); }
    #menuToggle { background: none; border: none; color: var(--white); font-size: 24px; cursor: pointer; }
    .sidebar { position: fixed; top: 0; left: -260px; width: 250px; height: 100%; background: var(--navy); padding: 20px; transition: left .3s; z-index: 20; overflow-y: auto; }
    .sidebar.open { left: 0; }
    .sidebar a { display: block; padding: 10px 0; color: var(--white); text-decoration: none; }
    .sidebar a:hover { color: var(--gold); }
    .sidebar a.current { font-weight: bold; color: var(--gold); }
    .nav-section { margin-top: 16px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.15); color: var(--gold); font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .sidebar .nav-section + a { margin-top: 4px; }
    #closeSidebar { background: none; border: none; color: var(--white); font-size: 22px; float: right; cursor: pointer; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(15,31,61,.4); z-index: 10; }
    .overlay.active { display: block; }
    main { max-width: 820px; margin: 28px auto; padding: 0 16px; display: grid; gap: 16px; }
    h1 { margin-bottom: 6px; }
    h2 { font-size: 18px; }
    .hint { color: var(--muted); font-size: 14px; }
    .error { background: #fdecec; color: #8a1c1c; border-radius: 10px; padding: 14px 18px; }
    .success { background: #e8f6ec; color: #1d5e33; border-radius: 10px; padding: 14px 18px; }
    .contacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    .card { border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 10px; padding: 16px 20px; display: grid; gap: 8px; box-shadow: 0 1px 4px rgba(15,31,61,.06); }
    .card-title { font-weight: 600; font-size: 17px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
    dt { font-weight: 600; color: var(--navy-soft); font-size: 14px; }
    dd { overflow-wrap: anywhere; }
    form { border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 12px; }
    label { font-weight: 600; font-size: 14px; }
    select, textarea, input { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); width: 100%; }
    input[readonly] { background: #f4f6fa; color: var(--navy-soft); }
    textarea { min-height: 120px; resize: vertical; }
    button.send-btn { font: inherit; background: var(--navy); color: var(--white); border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; justify-self: start; }
    button.send-btn:disabled { background: #9aa4b8; cursor: not-allowed; }
    ul { list-style: none; display: grid; gap: 10px; }
    .sent { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: grid; gap: 4px; }
    .sent-meta { color: var(--muted); font-size: 13px; }
    a { color: var(--navy); font-weight: bold; }
    [hidden] { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
</head>
<body>
  <header>
    <button id="menuToggle" aria-label="Open menu">&#9776;</button>
    <strong>Internship Platform</strong>
  </header>

  <div id="sidebar"></div>
  <script src="../js/sidebar.js"></script>
  <div class="overlay" id="overlay"></div>

  <main>
    <h1>Contact Supervisor or Coordinator</h1>
    <p class="hint">See the contact details of your assigned supervisor and training coordinator, and send them a direct inquiry.</p>

    <p id="status-text" class="hint" role="status">Loading your contacts...</p>
    <p id="error-box" class="error" role="alert" hidden></p>
    <p id="success-box" class="success" role="status" hidden></p>

    <section class="contacts" id="contacts" hidden>
      <div class="card" id="supervisor-card"></div>
      <div class="card" id="coordinator-card"></div>
    </section>

    <form id="inquiry-form" hidden novalidate>
      <h2>Send a direct inquiry</h2>
      <div>
        <label for="recipient">Send to</label>
        <select id="recipient">
          <option value="">Choose a recipient</option>
          <option value="supervisor">Supervisor</option>
          <option value="coordinator">Coordinator</option>
        </select>
      </div>
      <div>
        <label for="recipient-email">Recipient email</label>
        <input id="recipient-email" type="email" readonly placeholder="Filled in when you choose a recipient">
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" maxlength="2000" placeholder="Write your question here"></textarea>
      </div>
      <button type="submit" class="send-btn" id="send-btn">Send inquiry</button>
    </form>

    <section id="history" hidden>
      <h2>Your sent inquiries</h2>
      <ul id="history-list"></ul>
    </section>
  </main>

  <script>
    // Database names (see db/schema.sql)
    const STUDENT_TABLE = "student";
    const CYCLE_TABLE = "internshipcycle";
    const PROFESSOR_TABLE = "supervisingprofessor";
    const PLACE_TABLE = "employmentplace";
    const INQUIRY_TABLE = "studentinquiry";
    const MAX_MESSAGE = 2000;
    const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    const statusText = document.getElementById("status-text");
    const errorBox = document.getElementById("error-box");
    const successBox = document.getElementById("success-box");
    const contactsBox = document.getElementById("contacts");
    const supervisorCard = document.getElementById("supervisor-card");
    const coordinatorCard = document.getElementById("coordinator-card");
    const form = document.getElementById("inquiry-form");
    const recipientSelect = document.getElementById("recipient");
    const recipientEmail = document.getElementById("recipient-email");
    const messageBox = document.getElementById("message");
    const sendButton = document.getElementById("send-btn");
    const historyBox = document.getElementById("history");
    const historyList = document.getElementById("history-list");

    let supabaseClient = null;
    let student = null;
    const contacts = { supervisor: null, coordinator: null };

    function isEmpty(value) {
      return value === null || value === undefined || String(value).trim() === "";
    }

    function clean(value) {
      return isEmpty(value) ? "" : String(value).trim();
    }

    function validId(value) {
      return !isEmpty(value) && Number.isInteger(Number(value)) && Number(value) > 0;
    }

    function validEmail(value) {
      return EMAIL_PATTERN.test(clean(value));
    }

    function showError(message) {
      successBox.hidden = true;
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    function showSuccess(message) {
      errorBox.hidden = true;
      successBox.textContent = message;
      successBox.hidden = false;
    }

    function stopWithError(message) {
      statusText.hidden = true;
      contactsBox.hidden = true;
      form.hidden = true;
      historyBox.hidden = true;
      showError(message);
    }

    function addRow(list, label, value) {
      const dt = document.createElement("dt");
      dt.textContent = label;
      const dd = document.createElement("dd");
      dd.textContent = isEmpty(value) ? "Not provided" : clean(value);
      list.append(dt, dd);
    }

    function fillCard(card, title, person, emptyText) {
      card.replaceChildren();
      const heading = document.createElement("div");
      heading.className = "card-title";
      heading.textContent = title;
      card.append(heading);
      if (!person) {
        const note = document.createElement("p");
        note.className = "hint";
        note.textContent = emptyText;
        card.append(note);
        return;
      }
      const list = document.createElement("dl");
      addRow(list, "Name", person.name);
      addRow(list, "Email", person.email);
      addRow(list, "Phone", person.phone);
      if (!isEmpty(person.extra)) addRow(list, person.extraLabel, person.extra);
      card.append(list);
    }

    function formatDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "" : date.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    }

    async function loadHistory() {
      const { data, error } = await supabaseClient
        .from(INQUIRY_TABLE)
        .select("inquiry_id, recipient_role, recipient_email, message_content, sent_at")
        .eq("student_id", Number(student.student_id))
        .order("sent_at", { ascending: false })
        .limit(10);
      if (error) {
        console.error(error);
        historyBox.hidden = true;
        return;
      }
      historyList.replaceChildren();
      (data || []).forEach((row) => {
        const item = document.createElement("li");
        item.className = "sent";
        const meta = document.createElement("span");
        meta.className = "sent-meta";
        meta.textContent = "To " + clean(row.recipient_role) + " (" + clean(row.recipient_email) + ") - " + formatDate(row.sent_at);
        const text = document.createElement("span");
        text.textContent = clean(row.message_content);
        item.append(meta, text);
        historyList.append(item);
      });
      historyBox.hidden = !data || data.length === 0;
    }

    recipientSelect.addEventListener("change", () => {
      errorBox.hidden = true;
      const person = contacts[recipientSelect.value];
      recipientEmail.value = person ? clean(person.email) : "";
      if (recipientSelect.value && (!person || !validEmail(person.email))) {
        showError("The " + recipientSelect.value + " has no valid email address, so an inquiry cannot be sent to them.");
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!student || !validId(student.student_id)) {
        showError("Your student_id is missing or invalid, so the inquiry cannot be sent.");
        return;
      }
      const role = recipientSelect.value;
      if (role !== "supervisor" && role !== "coordinator") {
        showError("Please choose who the inquiry is for: your supervisor or your coordinator.");
        return;
      }
      const person = contacts[role];
      if (!person || !validEmail(person.email)) {
        showError("The recipient email is missing or wrong, so the inquiry cannot be sent.");
        return;
      }
      const message = clean(messageBox.value);
      if (!message) {
        showError("The message is empty. Please write your question before sending.");
        return;
      }
      if (message.length > MAX_MESSAGE) {
        showError("The message is too long. Please keep it under " + MAX_MESSAGE + " characters.");
        return;
      }

      sendButton.disabled = true;
      sendButton.textContent = "Sending...";
      const { error } = await supabaseClient.from(INQUIRY_TABLE).insert({
        student_id: Number(student.student_id),
        recipient_role: role,
        recipient_email: clean(person.email),
        message_content: message
      });
      sendButton.disabled = false;
      sendButton.textContent = "Send inquiry";

      if (error) {
        console.error(error);
        showError("Your inquiry could not be sent. Please try again later.");
        return;
      }
      showSuccess("Your inquiry was sent to your " + role + " (" + clean(person.email) + ").");
      messageBox.value = "";
      loadHistory();
    });

    async function init() {
      if (typeof SUPABASE_URL === "undefined" || typeof SUPABASE_ANON_KEY === "undefined" || !window.supabase) {
        stopWithError("This page cannot connect to the database right now. Please try again later.");
        return;
      }
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      try {
        const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
        const user = sessionData && sessionData.session ? sessionData.session.user : null;
        if (sessionError || !user) {
          statusText.innerHTML = 'You are not signed in. <a href="../index.html">Sign in</a> to contact your supervisor or coordinator.';
          return;
        }

        // The student_id comes from the signed-in account, never from a typed field
        const { data: studentRow, error: studentError } = await supabaseClient
          .from(STUDENT_TABLE)
          .select("student_id, internship_cycle_id, employment_place")
          .eq("user_id", user.id)
          .maybeSingle();

        if (studentError) {
          console.error(studentError);
          stopWithError("Your student record could not be loaded. Please try again later.");
          return;
        }
        if (!studentRow || !validId(studentRow.student_id)) {
          stopWithError("Your student_id is missing or invalid, so your contacts cannot be shown and inquiries cannot be sent.");
          return;
        }
        student = studentRow;

        // Supervisor: student -> internship cycle -> supervising professor
        let placeName = clean(student.employment_place);
        if (validId(student.internship_cycle_id)) {
          const { data: cycle, error: cycleError } = await supabaseClient
            .from(CYCLE_TABLE)
            .select("professor_id, place_name")
            .eq("cycle_id", Number(student.internship_cycle_id))
            .maybeSingle();
          if (cycleError) console.error(cycleError);
          if (cycle) {
            if (!isEmpty(cycle.place_name)) placeName = clean(cycle.place_name);
            if (validId(cycle.professor_id)) {
              const { data: professor, error: professorError } = await supabaseClient
                .from(PROFESSOR_TABLE)
                .select("*")
                .eq("professor_id", Number(cycle.professor_id))
                .maybeSingle();
              if (professorError) console.error(professorError);
              if (professor) {
                contacts.supervisor = {
                  name: professor.name,
                  email: professor.email,
                  phone: professor.phone_number,
                  extra: professor.department,
                  extraLabel: "Department"
                };
              }
            }
          }
        }

        // Coordinator: the coordination office of the training site
        if (placeName) {
          const { data: place, error: placeError } = await supabaseClient
            .from(PLACE_TABLE)
            .select("place_name, coordination_office, email, phone_number")
            .eq("place_name", placeName)
            .maybeSingle();
          if (placeError) console.error(placeError);
          if (place) {
            contacts.coordinator = {
              name: isEmpty(place.coordination_office) ? place.place_name : place.coordination_office,
              email: place.email,
              phone: place.phone_number,
              extra: place.place_name,
              extraLabel: "Training site"
            };
          }
        }

        fillCard(supervisorCard, "Supervisor", contacts.supervisor, "No supervisor is assigned to you yet.");
        fillCard(coordinatorCard, "Coordinator", contacts.coordinator, "No training site coordinator is assigned to you yet.");

        statusText.hidden = true;
        contactsBox.hidden = false;
        if (!contacts.supervisor && !contacts.coordinator) {
          showError("You have no assigned supervisor or coordinator yet, so inquiries cannot be sent.");
          return;
        }
        form.hidden = false;
        loadHistory();
      } catch (err) {
        console.error(err);
        stopWithError("Your contacts could not be loaded. Please try again later.");
      }
    }

    init();

    // Side menu
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    function openSidebar() { sidebar.classList.add("open"); overlay.classList.add("active"); }
    function hideSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("active"); }
    document.getElementById("menuToggle").addEventListener("click", openSidebar);
    document.getElementById("closeSidebar").addEventListener("click", hideSidebar);
    overlay.addEventListener("click", hideSidebar);
  </script>
</body>
</html>
