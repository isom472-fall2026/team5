<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My internship progress | Field Training</title>
  <style>
    :root {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #0f1f3d;
      color: #ffffff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      background: #0a1630;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 { margin: 0; font-size: 22px; }
    a { color: #8fb3ff; }
    main { width: min(900px, calc(100% - 32px)); margin: 28px auto; display: grid; gap: 16px; }
    .hint { color: #b8c4dd; font-size: 14px; margin: 0; }
    .error { background: #5a1a1a; color: #ffd6d6; border-radius: 8px; padding: 14px 18px; margin: 0; }
    .small-error { color: #ffd6d6; font-size: 14px; margin: 6px 0 0; }
    .card { background: #1a2d52; border-radius: 8px; padding: 20px 22px; }
    .card h2 { margin: 0 0 14px; font-size: 18px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 10px 18px; margin: 0; }
    dt { color: #b8c4dd; }
    dd { margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .big { font-size: 40px; font-weight: 700; margin: 0; line-height: 1.1; }
    .unit { color: #b8c4dd; font-size: 15px; margin: 4px 0 0; }
    [hidden] { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
</head>
<body>
  <header>
    <h1>My internship progress</h1>
    <a href="navigation-menu.html">Back to menu</a>
  </header>

  <main>
    <p id="status-text" class="hint" role="status">Loading your internship summary...</p>
    <p id="error-box" class="error" role="alert" hidden></p>

    <div id="summary" hidden>
      <section class="card">
        <h2>Internship</h2>
        <dl>
          <dt>Place</dt><dd id="place">-</dd>
          <dt>Semester</dt><dd id="semester">-</dd>
          <dt>Year</dt><dd id="year">-</dd>
        </dl>
      </section>

      <div class="grid" style="margin-top: 16px;">
        <section class="card">
          <h2>Logged hours</h2>
          <p id="total-hours" class="big">-</p>
          <p class="unit">hours in total</p>
          <p id="hours-error" class="small-error" hidden></p>
        </section>

        <section class="card">
          <h2>Weekly progress reports</h2>
          <p id="report-count" class="big">-</p>
          <p id="latest-report" class="unit">-</p>
          <p id="reports-error" class="small-error" hidden></p>
        </section>
      </div>
    </div>
  </main>

  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusText = document.getElementById("status-text");
    const errorBox = document.getElementById("error-box");
    const summary = document.getElementById("summary");

    const NOT_ASSIGNED = "You are not assigned to an internship cycle yet";

    function isEmpty(value) {
      return value === null || value === undefined || String(value).trim() === "";
    }

    function isValidId(value) {
      return !isEmpty(value) && Number.isInteger(Number(value)) && Number(value) > 0;
    }

    function showError(message) {
      statusText.hidden = true;
      summary.hidden = true;
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    function setText(id, value) {
      document.getElementById(id).textContent = isEmpty(value) ? "-" : value;
    }

    function showSmallError(id, message) {
      const box = document.getElementById(id);
      box.textContent = message;
      box.hidden = false;
    }

    async function loadHours(studentId) {
      const { data, error } = await supabaseClient
        .from("dailyinternshiplog")
        .select("total_hours")
        .eq("student_id", studentId);

      if (error) {
        showSmallError("hours-error", `Could not load your hours: ${error.message}`);
        return;
      }

      const total = data.reduce((sum, log) => sum + (Number(log.total_hours) || 0), 0);
      setText("total-hours", Number.isInteger(total) ? total : total.toFixed(2));
    }

    async function loadReports(studentId) {
      const { data, error } = await supabaseClient
        .from("weeklyprogressreport")
        .select("submitted_at")
        .eq("student_id", studentId)
        .order("submitted_at", { ascending: false });

      if (error) {
        showSmallError("reports-error", `Could not load your weekly reports: ${error.message}`);
        return;
      }

      setText("report-count", data.length);
      const latest = data[0]?.submitted_at;
      setText("latest-report", latest
        ? `Latest submitted on ${new Date(latest).toLocaleDateString()}`
        : "No reports submitted yet");
    }

    async function loadSummary() {
      const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
      const user = sessionData?.session?.user;

      if (sessionError || !user) {
        statusText.innerHTML = 'You are not signed in. <a href="../index.html">Sign in</a> to see your progress.';
        return;
      }

      const { data: student, error: studentError } = await supabaseClient
        .from("student")
        .select("student_id, internship_cycle_id")
        .eq("user_id", user.id)
        .maybeSingle();

      if (studentError) {
        showError(`Could not check your student record: ${studentError.message}`);
        return;
      }

      if (!student || !isValidId(student.student_id) || !isValidId(student.internship_cycle_id)) {
        showError(NOT_ASSIGNED);
        return;
      }

      const { data: cycle, error: cycleError } = await supabaseClient
        .from("internshipcycle")
        .select("place_name, semester, year")
        .eq("cycle_id", student.internship_cycle_id)
        .maybeSingle();

      if (cycleError) {
        showError(`Could not load your internship cycle: ${cycleError.message}`);
        return;
      }
      if (!cycle) {
        showError(NOT_ASSIGNED);
        return;
      }

      setText("place", cycle.place_name);
      setText("semester", cycle.semester);
      setText("year", cycle.year);

      statusText.hidden = true;
      summary.hidden = false;

      await Promise.all([loadHours(student.student_id), loadReports(student.student_id)]);
    }

    loadSummary();
  </script>
</body>
</html>
