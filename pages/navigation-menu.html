<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Navigation Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        /* Top dashboard bar */
        .dashboard-header {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dashboard-header h1 {
            font-size: 20px;
            margin: 0;
        }

        /* Criterion 1: navigation icon shown on dashboard after login */
        .nav-icon {
            cursor: pointer;
            font-size: 28px;
            background: none;
            border: none;
            color: white;
        }

        .nav-icon:hover {
            color: #1abc9c;
        }

        /* Criterion 2: side panel with key modules */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 260px;
            background: #34495e;
            color: white;
            transition: transform 0.3s ease;
            transform: translateX(-100%);
            padding-top: 60px;
            z-index: 1000;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar ul li {
            padding: 15px 25px;
            border-bottom: 1px solid #3f5468;
            cursor: pointer;
        }

        .sidebar ul li:hover {
            background: #1abc9c;
        }

        /* Criterion 3: collapsible, does not affect current page state */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        .main-content {
            padding: 30px;
        }

        .main-content p {
            color: #555;
        }
    </style>
</head>

<body>

    <div class="dashboard-header">
        <h1>Student Dashboard</h1>
        <button class="nav-icon" id="menuToggle" title="Open navigation menu">&#9776;</button>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
        <button class="close-btn" id="closeSidebar">&times;</button>
        <ul>
            <li>Profile</li>
            <li>Training Site Selection</li>
            <li>Internship Hours</li>
            <li>Reports</li>
            <li><a href="contact-support.html">Contact Support</a></li>
        </ul>
    </div>

    <div class="main-content">
        <p>Welcome back! This is your current page content, and it stays exactly as it is whether the side menu is open
            or closed.</p>
    </div>

    <script>
        const menuToggle = document.getElementById("menuToggle");
        const sidebar = document.getElementById("sidebar");
        const closeSidebar = document.getElementById("closeSidebar");
        const overlay = document.getElementById("overlay");

        function openSidebar() {
            sidebar.classList.add("open");
            overlay.classList.add("active");
        }

        function hideSidebar() {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        }

        menuToggle.addEventListener("click", openSidebar);
        closeSidebar.addEventListener("click", hideSidebar);
        overlay.addEventListener("click", hideSidebar);
    </script>

</body>

</html>
