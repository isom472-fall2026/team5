<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Requirements</title>
<style>
  :root {
    --navy: #0f1f3d;
    --navy-soft: #33415c;
    --gold: #f2c230;
    --white: #ffffff;
    --line: #e3e8f0;
    --muted: #5a6785;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: var(--white); color: var(--navy); }
  header { background: var(--navy); color: var(--white); padding: 14px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 4px solid var(--gold); }
  #menuToggle { background: none; border: none; color: var(--white); font-size: 24px; cursor: pointer; }
  .sidebar { position: fixed; top: 0; left: -260px; width: 250px; height: 100%; background: var(--navy); padding: 20px; transition: left .3s; z-index: 20; }
  .sidebar.open { left: 0; }
  .sidebar a { display: block; padding: 10px 0; color: var(--white); text-decoration: none; }
  .sidebar a:hover { color: var(--gold); }
  .sidebar a.current { font-weight: bold; color: var(--gold); }
  #closeSidebar { background: none; border: none; color: var(--white); font-size: 22px; float: right; cursor: pointer; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(15,31,61,.4); z-index: 10; }
  .overlay.active { display: block; }
  main { max-width: 700px; margin: 28px auto; padding: 0 16px; }
  h1 { margin-bottom: 6px; color: var(--navy); }
  h2 { font-size: 17px; margin-bottom: 10px; color: var(--navy); }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .card { background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(15,31,61,.06); }
  .card p { color: var(--navy-soft); margin-bottom: 8px; line-height: 1.4; }
  .card ul { margin-left: 20px; color: var(--navy-soft); }
  .doc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
  .doc-row label { min-width: 140px; font-weight: bold; color: var(--navy); }
  .doc-row input { color: var(--navy-soft); }
  select { padding: 8px; border-radius: 6px; border: 1px solid #c3cad8; margin-bottom: 14px; min-width: 220px; color: var(--navy); background: var(--white); }
  button.submit { background: var(--navy); color: var(--white); border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; margin-top: 8px; font-weight: bold; }
  button.submit:hover { background: var(--gold); color: var(--navy); }
  button.submit:disabled { background: #c3cad8; color: var(--white); cursor: not-allowed; }
  .ok { background: #e8f6ee; color: #1d5a36; border-radius: 10px; padding: 12px; margin-bottom: 16px; }
  .error { background: #fdecec; color: #8a1c1c; border-radius: 10px; padding: 12px; margin-bottom: 16px; }
  .error a { color: #8a1c1c; font-weight: bold; }
  .loading { color: var(--muted); }
  .msg { margin-top: 10px; font-weight: bold; }
  .msg.good { color: #1d7a45; }
  .msg.bad { color: #b42318; }
</style>
</head>
<body>
<header>
  <button id="menuToggle">&#9776;</button>
  <strong>Internship Platform</strong>
</header>
 <nav class="sidebar" id="sidebar">
  <button id="closeSidebar">&times;</button>
  <a href="navigation-menu.html">Home</a>
  <a href="placement-details.html">Placement Details</a>
  <a href="company-requirements.html" class="current">Company Requirements</a>
  <a href="evaluation-criteria.html">Evaluation Criteria</a>
  <a href="progress-summary.html">Progress Summary</a>
  <a href="reported-issues.html">Reported Issues</a>
  <a href="contact-support.html">Contact Support</a>
</nav>
<div class="overlay" id="overlay"></div>

<main>
  <h1>Company Requirements</h1>
  <p class="sub">See what each training company needs, then upload your documents before applying.</p>
  <div id="creditBox"><p class="loading">Loading your details...</p></div>
  <div id="companies"></div>
  <div id="upload"></div>
</main>

<!-- Supabase library + the team's connection settings -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>

<script>
  const MIN_CREDITS = 90;
  const BUCKET = "student-documents";
  const MAX_MB = 5;
  // Only these file types are accepted (criterion 3 + bad input)
  const ALLOWED = {
    pdf: ["application/pdf"],
    jpg: ["image/jpeg"],
    jpeg: ["image/jpeg"],
    png: ["image/png"]
  };

  let db = null;
  let currentUser = null;
  let eligible = false;
  let validPlaces = [];

  function esc(text) {
    const div = document.createElement("div");
    div.textContent = text == null ? "" : String(text);
    return div.innerHTML;
  }

  function pageError(text) {
    document.getElementById("creditBox").innerHTML = `<div class="error">${esc(text)}</div>`;
  }

  // required_documents is stored as text, e.g. "CV, Civil ID, Personal Photo"
  function docList(value) {
    if (!value) return [];
    return String(value).split(/[,\n;]/).map(d => d.trim()).filter(d => d !== "");
  }

  // Criterion 4: find missing or invalid company columns
  function missingColumns(p) {
    const missing = [];
    if (!p.place_id) missing.push("place_id");
    if (!p.place_name || !p.place_name.trim()) missing.push("place_name");
    if (!p.company_requirements || !p.company_requirements.trim()) missing.push("company_requirements");
    if (docList(p.required_documents).length === 0) missing.push("required_documents");
    return missing;
  }

  // Bad input: reject anything that is not PDF, JPG or PNG, or is too big
  function checkFile(file) {
    const ext = file.name.includes(".") ? file.name.split(".").pop().toLowerCase() : "";
    if (!ALLOWED[ext] || (file.type && !ALLOWED[ext].includes(file.type))) {
      return `"${file.name}" is not allowed. Please upload a PDF, JPG or PNG file.`;
    }
    if (file.size > MAX_MB * 1024 * 1024) {
      return `"${file.name}" is larger than ${MAX_MB} MB. Please upload a smaller file.`;
    }
    return null;
  }

  // Criterion 2: check the student's own credit units
  function showCredits(credits) {
    const box = document.getElementById("creditBox");
    if (credits == null) {
      eligible = false;
      box.innerHTML = `<div class="error">Your completed credit units are not recorded yet. Please contact the internship coordinator.</div>`;
    } else if (credits >= MIN_CREDITS) {
      eligible = true;
      box.innerHTML = `<div class="ok">You have completed ${esc(credits)} credit units. You meet the minimum of ${MIN_CREDITS} units.</div>`;
    } else {
      eligible = false;
      box.innerHTML = `<div class="error">You have completed ${esc(credits)} credit units. You need at least ${MIN_CREDITS} units before applying.</div>`;
    }
  }

  // Criterion 1: show each company's prerequisites and required documents
  function showCompanies(places) {
    const box = document.getElementById("companies");
    if (places.length === 0) {
      box.innerHTML = `<div class="error">No approved training companies are available yet.</div>`;
      return;
    }
    validPlaces = [];
    box.innerHTML = places.map(p => {
      const missing = missingColumns(p);
      if (missing.length) {
        return `<div class="error"><strong>${esc(p.place_name || "A company")}:</strong> missing company specifications (${missing.join(", ")}).</div>`;
      }
      validPlaces.push(p);
      const docs = docList(p.required_documents).map(d => `<li>${esc(d)}</li>`).join("");
      return `
        <div class="card">
          <h2>${esc(p.place_name)}</h2>
          <p>${esc(p.company_requirements)}</p>
          <p><strong>Required documents:</strong></p>
          <ul>${docs}</ul>
        </div>`;
    }).join("");
  }

  // Criterion 3: upload feature
  function showUpload() {
    const box = document.getElementById("upload");
    if (validPlaces.length === 0) { box.innerHTML = ""; return; }
    const options = validPlaces.map(p => `<option value="${esc(p.place_id)}">${esc(p.place_name)}</option>`).join("");
    box.innerHTML = `
      <div class="card">
        <h2>Upload your documents</h2>
        <select id="placeSelect">
          <option value="">Choose a company</option>
          ${options}
        </select>
        <div id="docInputs"></div>
        <button class="submit" id="submitBtn" disabled>Upload</button>
        <div class="msg" id="msg"></div>
      </div>`;

    document.getElementById("placeSelect").addEventListener("change", renderDocInputs);
    document.getElementById("submitBtn").addEventListener("click", uploadDocuments);
  }

  function renderDocInputs() {
    const id = document.getElementById("placeSelect").value;
    const place = validPlaces.find(p => String(p.place_id) === id);
    const btn = document.getElementById("submitBtn");
    document.getElementById("msg").textContent = "";
    if (!place) {
      document.getElementById("docInputs").innerHTML = "";
      btn.disabled = true;
      return;
    }
    document.getElementById("docInputs").innerHTML = docList(place.required_documents).map(d => `
      <div class="doc-row">
        <label>${esc(d)}</label>
        <input type="file" accept=".pdf,.jpg,.jpeg,.png" data-doc="${esc(d)}">
      </div>`).join("");
    btn.disabled = !eligible;
  }

  async function uploadDocuments() {
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submitBtn");
    const placeId = document.getElementById("placeSelect").value;
    const inputs = [...document.querySelectorAll('#docInputs input[type="file"]')];

    if (!eligible) {
      msg.className = "msg bad";
      msg.textContent = `You need at least ${MIN_CREDITS} credit units before uploading.`;
      return;
    }
    if (inputs.some(i => i.files.length === 0)) {
      msg.className = "msg bad";
      msg.textContent = "Please choose a file for every required document.";
      return;
    }
    for (const input of inputs) {
      const problem = checkFile(input.files[0]);
      if (problem) {
        msg.className = "msg bad";
        msg.textContent = problem;
        return;
      }
    }

    btn.disabled = true;
    msg.className = "msg";
    msg.textContent = "Uploading...";

    try {
      for (const input of inputs) {
        const file = input.files[0];
        const ext = file.name.split(".").pop().toLowerCase();
        const docName = input.dataset.doc.toLowerCase().replace(/[^a-z0-9]+/g, "-");
        const path = `${currentUser.id}/${placeId}/${docName}.${ext}`;
        const { error } = await db.storage.from(BUCKET).upload(path, file, { upsert: true });
        if (error) throw error;
      }
      msg.className = "msg good";
      msg.textContent = "Documents uploaded successfully.";
    } catch (err) {
      console.error(err);
      msg.className = "msg bad";
      msg.textContent = "Your documents could not be uploaded. Please try again, or contact the internship coordinator if it keeps happening.";
    } finally {
      btn.disabled = false;
    }
  }

  async function init() {
    if (typeof SUPABASE_URL === "undefined" || typeof SUPABASE_ANON_KEY === "undefined" || !window.supabase) {
      pageError("This page cannot connect to the database right now. Please try again later.");
      return;
    }
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    try {
      const { data: { user } } = await db.auth.getUser();
      if (!user) {
        document.getElementById("creditBox").innerHTML =
          '<div class="error">You are not signed in. <a href="../index.html">Sign in</a> to see company requirements.</div>';
        return;
      }
      currentUser = user;

      // The signed-in student's own record
      const { data: student, error: sErr } = await db
        .from("student")
        .select("student_id, credits_passed")
        .eq("user_id", user.id)
        .maybeSingle();
      if (sErr) throw sErr;
      if (!student) {
        pageError("Your account is not linked to a student record yet. Please contact the internship coordinator.");
        return;
      }
      showCredits(student.credits_passed);

      // Approved training companies
      const { data: places, error: pErr } = await db
        .from("employmentplace")
        .select("place_id, place_name, company_requirements, required_documents")
        .eq("is_approved", true)
        .order("place_name");
      if (pErr) throw pErr;

      showCompanies(places || []);
      showUpload();
    } catch (err) {
      console.error(err);
      pageError("Company requirements could not be loaded. Please try again later.");
    }
  }

  init();

  // Side menu
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");
  function openSidebar() { sidebar.classList.add("open"); overlay.classList.add("active"); }
  function hideSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("active"); }
  document.getElementById("menuToggle").addEventListener("click", openSidebar);
  document.getElementById("closeSidebar").addEventListener("click", hideSidebar);
  overlay.addEventListener("click", hideSidebar);
</script>
</body>
</htm>
