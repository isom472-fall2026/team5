<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update Student Profile</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#243047}
main{max-width:520px;margin:45px auto;background:white;padding:28px;border-radius:12px;box-shadow:0 3px 14px #0001}
h1{font-size:25px}label{display:block;margin-top:16px;font-weight:bold}
input{box-sizing:border-box;width:100%;padding:11px;margin-top:6px;border:1px solid #aab4c3;border-radius:6px}
button{margin-top:20px;padding:12px 20px;background:#164b79;color:white;border:0;border-radius:6px;cursor:pointer}
#message{margin-top:16px;font-weight:bold}
</style>
</head>
<body>
<main>
<h1>Update Student Profile</h1>
<p>Story #54 — Student contact information</p>
<form id="profileForm">
<label for="studentId">Student ID</label>
<input id="studentId" required placeholder="Enter student ID">
<label for="phone">Phone Number</label>
<input id="phone" type="tel" required placeholder="Enter phone number">
<label for="email">Student Email</label>
<input id="email" type="email" required placeholder="student@example.com">
<label for="cv">CV Link</label>
<input id="cv" type="url" placeholder="https://example.com/cv.pdf">
<button type="submit">Save Changes</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
</main>
<script>
document.getElementById('profileForm').addEventListener('submit',function(e){
e.preventDefault();
const id=document.getElementById('studentId').value.trim();
const phone=document.getElementById('phone').value.trim();
const email=document.getElementById('email').value.trim();
const message=document.getElementById('message');
message.style.color='#b42318';
if(!/^[A-Za-z0-9-]{4,20}$/.test(id)){
message.textContent='Error: Invalid student ID.';return;
}
if(!/^\+?[0-9 ()-]{7,20}$/.test(phone)){
message.textContent='Error: Invalid phone number.';return;
}
if(!email.includes('@')){
message.textContent='Error: Invalid email address.';return;
}
if(!confirm('Are you sure you want to save these profile changes?')){
message.textContent='Update cancelled.';return;
}
message.style.color='#9a6700';
message.textContent='Form validated. Demo only: database update is not connected.';
});
</script>
</body>
</html>
