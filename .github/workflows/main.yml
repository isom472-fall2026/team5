name: Check HTML pages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check that no HTML page is empty
        run: |
          empty=$(find . -name "*.html" -not -path "./.git/*" -empty)
          if [ -n "$empty" ]; then
            echo "These HTML files are empty:"
            echo "$empty"
            exit 1
          fi
          echo "All HTML pages have content."
