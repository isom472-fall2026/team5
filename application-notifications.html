<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My reported issues | Field Training</title>
  <style>
    :root {
      --navy: #0f1f3d;
      --navy-soft: #33415c;
      --gold: #f2c230;
      --white: #ffffff;
      --line: #e3e8f0;
      --muted: #5a6785;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: var(--white); color: var(--navy); }
    header { background: var(--navy); color: var(--white); padding: 14px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 4px solid var(--gold); }
    #menuToggle { background: none; border: none; color: var(--white); font-size: 24px; cursor: pointer; }
    .sidebar { position: fixed; top: 0; left: -260px; width: 250px; height: 100%; background: var(--navy); padding: 20px; transition: left .3s; z-index: 20; overflow-y: auto; }
    .sidebar.open { left: 0; }
    .sidebar a { display: block; padding: 10px 0; color: var(--white); text-decoration: none; }
    .sidebar a:hover { color: var(--gold); }
    .sidebar a.current { font-weight: bold; color: var(--gold); }
    .nav-section { margin-top: 16px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.15); color: var(--gold); font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .sidebar .nav-section + a { margin-top: 4px; }
    #closeSidebar { background: none; border: none; color: var(--white); font-size: 22px; float: right; cursor: pointer; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(15,31,61,.4); z-index: 10; }
    .overlay.active { display: block; }
    main { max-width: 800px; margin: 28px auto; padding: 0 16px; display: grid; gap: 14px; }
    h1 { margin-bottom: 6px; color: var(--navy); }
    .hint { color: var(--muted); font-size: 14px; margin: 0; }
    .error { background: #fdecec; color: #8a1c1c; border-radius: 10px; padding: 14px 18px; margin: 0; }
    .empty { background: #fff7da; border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 10px; padding: 20px; text-align: center; color: #6b5317; margin: 0; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .issue { background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 10px; padding: 16px 20px; display: grid; gap: 8px; box-shadow: 0 1px 4px rgba(15,31,61,.06); }
    .issue-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .category { font-weight: 600; font-size: 16px; color: var(--navy); }
    .description { color: var(--navy-soft); margin: 0; }
    .date { color: var(--muted); font-size: 13px; }
    .status { padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .status-submitted { background: #e8eef8; color: #1e3a6c; }
    .status-under-review { background: #fff3cd; color: #7a5c00; }
    .status-resolved { background: #e6f4ea; color: #137333; }
    a { color: var(--navy); font-weight: bold; }
    [hidden] { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
</head>
<body>
  <header>
    <button id="menuToggle">&#9776;</button>
    <strong>Internship Platform</strong>
  </header>

  <nav class="sidebar" id="sidebar">
    <button id="closeSidebar">&times;</button>
    <a href="../index.html">Home</a>

    <p class="nav-section">Placement</p>
    <a href="placement-details.html">Placement Details</a>
    <a href="company-requirements.html">Company Requirements</a>

    <p class="nav-section">Reports</p>
    <a href="progress-summary.html">Progress Summary</a>
    <a href="reported-issues.html" class="current">Reported Issues</a>

    <p class="nav-section">Evaluation</p>
    <a href="evaluation-criteria.html">Evaluation Criteria</a>

    <p class="nav-section">Help</p>
    <a href="contact-support.html">Contact Support</a>
  </nav>
  <div class="overlay" id="overlay"></div>

  <main>
    <h1>My Reported Issues</h1>
    <p id="status-text" class="hint" role="status">Loading your reported issues...</p>
    <p id="error-box" class="error" role="alert" hidden></p>
    <p id="empty-box" class="empty" hidden>You have not reported any issues yet</p>
    <ul id="issue-list"></ul>
  </main>

  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusText = document.getElementById("status-text");
    const errorBox = document.getElementById("error-box");
    const emptyBox = document.getElementById("empty-box");
    const issueList = document.getElementById("issue-list");

    const requiredColumns = ["issue_report_id", "category", "status", "submitted_at"];
    const allowedStatuses = ["Submitted", "Under review", "Resolved"];

    function isEmpty(value) {
      return value === null || value === undefined || String(value).trim() === "";
    }

    function showError(message) {
      statusText.hidden = true;
      issueList.replaceChildren();
      emptyBox.hidden = true;
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    function findProblemColumns(issue) {
      return requiredColumns.filter((column) => {
        const value = issue[column];
        if (isEmpty(value)) return true;
        if (column === "status") return !allowedStatuses.includes(value);
        if (column === "submitted_at") return Number.isNaN(new Date(value).getTime());
        return false;
      });
    }

    function shortText(text, max = 120) {
      if (isEmpty(text)) return "No description";
      const clean = String(text).trim();
      return clean.length > max ? clean.slice(0, max) + "..." : clean;
    }

    function addIssue(issue) {
      const item = document.createElement("li");
      item.className = "issue";

      const top = document.createElement("div");
      top.className = "issue-top";

      const category = document.createElement("span");
      category.className = "category";
      category.textContent = issue.category;

      const status = document.createElement("span");
      status.className = "status status-" + issue.status.toLowerCase().replace(" ", "-");
      status.textContent = issue.status;

      top.append(category, status);

      const description = document.createElement("p");
      description.className = "description";
      description.textContent = shortText(issue.description);

      const date = document.createElement("span");
      date.className = "date";
      date.textContent = "Submitted on " + new Date(issue.submitted_at).toLocaleDateString();

      item.append(top, description, date);
      issueList.append(item);
    }

    async function loadIssues() {
      const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
      const user = sessionData?.session?.user;

      if (sessionError || !user) {
        statusText.innerHTML = 'You are not signed in. <a href="../index.html">Sign in</a> to see your reported issues.';
        return;
      }

      const { data: student, error: studentError } = await supabaseClient
        .from("student")
        .select("student_id")
        .eq("user_id", user.id)
        .maybeSingle();

      if (studentError) {
        showError(Could not check your student record: ${studentError.message});
        return;
      }
      if (!student || isEmpty(student.student_id) || !Number.isInteger(Number(student.student_id))) {
        showError("Your student_id is missing or invalid, so your reported issues cannot be shown.");
        return;
      }

      const { data: issues, error } = await supabaseClient
        .from("internshipissuereport")
        .select("issue_report_id, category, description, status, submitted_at")
        .eq("student_id", student.student_id)
        .order("submitted_at", { ascending: false });

      if (error) {
        showError(Could not load issues from the InternshipIssueReport table: ${error.message});
        return;
      }

      const problems = [];
      issues.forEach((issue, index) => {
        const columns = findProblemColumns(issue);
        if (columns.length) {
          const label = isEmpty(issue.issue_report_id) ? Issue #${index + 1} : Issue ${issue.issue_report_id};
          problems.push(${label}: ${columns.join(", ")});
        }
      });

      if (problems.length) {
        showError("Some reported issues have missing or invalid data in the InternshipIssueReport table. " + problems.join(" | "));
        return;
      }

      statusText.hidden = true;
      if (!issues.length) {
        emptyBox.hidden = false;
        return;
      }

      for (const issue of issues) addIssue(issue);
    }

    loadIssues();

    // Side menu
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    function openSidebar() { sidebar.classList.add("open"); overlay.classList.add("active"); }
    function hideSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("active"); }
    document.getElementById("menuToggle").addEventListener("click", openSidebar);
    document.getElementById("closeSidebar").addEventListener("click", hideSidebar);
    overlay.addEventListener("click", hideSidebar);
  </script>
</body>
</html>
