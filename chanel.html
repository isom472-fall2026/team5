<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Internship Channels</title>
  <style>
    :root {
      --navy: #0f1f3d;
      --navy-soft: #33415c;
      --gold: #f2c230;
      --white: #ffffff;
      --line: #e3e8f0;
      --muted: #5a6785;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: var(--white); color: var(--navy); }
    header { background: var(--navy); color: var(--white); padding: 14px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 4px solid var(--gold); }
    #menuToggle { background: none; border: none; color: var(--white); font-size: 24px; cursor: pointer; }
    .sidebar { position: fixed; top: 0; left: -260px; width: 250px; height: 100%; background: var(--navy); padding: 20px; transition: left .3s; z-index: 20; overflow-y: auto; }
    .sidebar.open { left: 0; }
    .sidebar a { display: block; padding: 10px 0; color: var(--white); text-decoration: none; }
    .sidebar a:hover { color: var(--gold); }
    .sidebar a.current { font-weight: bold; color: var(--gold); }
    .nav-section { margin-top: 16px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.15); color: var(--gold); font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .sidebar .nav-section + a { margin-top: 4px; }
    #closeSidebar { background: none; border: none; color: var(--white); font-size: 22px; float: right; cursor: pointer; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(15,31,61,.4); z-index: 10; }
    .overlay.active { display: block; }
    main { max-width: 700px; margin: 28px auto; padding: 0 16px; display: grid; gap: 14px; }
    h1 { color: var(--navy); }
    h2 { font-size: 17px; color: var(--navy); margin-bottom: 10px; }
    .hint { color: var(--muted); font-size: 14px; }
    .card { background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(15,31,61,.06); }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--navy); }
    .form-group { margin-bottom: 14px; }
    input[type="text"], select { width: 100%; padding: 9px; border: 1px solid #c3cad8; border-radius: 6px; font-size: 14px; color: var(--navy); background: var(--white); }
    button.submit { width: 100%; padding: 10px; background: var(--navy); color: var(--white); border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; }
    button.submit:hover { background: var(--gold); color: var(--navy); }
    button.submit:disabled { background: #c3cad8; color: var(--white); cursor: not-allowed; }
    .message { margin-top: 12px; padding: 10px; border-radius: 8px; }
    .error { background: #fdecec; color: #8a1c1c; }
    .success { background: #e8f6ee; color: #1d5a36; }
    .channel-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .channel-item:last-child { border-bottom: none; }
    .channel-item strong { color: var(--navy); }
    .channel-item span { color: var(--muted); font-size: 13px; }
    a { color: var(--navy); font-weight: bold; }
    [hidden] { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <header>
    <button id="menuToggle">&#9776;</button>
    <strong>Internship Platform</strong>
  </header>

  <nav class="sidebar" id="sidebar">
    <button id="closeSidebar">&times;</button>
    <a href="index.html">Home</a>

    <p class="nav-section">Placement</p>
    <a href="pages/placement-details.html">Placement Details</a>
    <a href="pages/company-requirements.html">Company Requirements</a>
    <a href="chanel.html" class="current">Company Channels</a>

    <p class="nav-section">Reports</p>
    <a href="pages/progress-summary.html">Progress Summary</a>
    <a href="pages/reported-issues.html">Reported Issues</a>

    <p class="nav-section">Evaluation</p>
    <a href="pages/evaluation-criteria.html">Evaluation Criteria</a>

    <p class="nav-section">Help</p>
    <a href="pages/contact-support.html">Contact Support</a>
  </nav>
  <div class="overlay" id="overlay"></div>

  <main>
    <h1>Company Internship Channels</h1>
    <p class="hint" id="statusText">Loading...</p>
    <div class="message error" id="pageError" hidden></div>

    <!-- Only supervising professors and employment places see this form -->
    <section class="card" id="createCard" hidden>
      <h2>Create a channel</h2>
      <div class="form-group">
        <label for="placeName">Company</label>
        <select id="placeName">
          <option value="">Loading companies...</option>
        </select>
      </div>
      <div class="form-group">
        <label for="channelName">Channel name</label>
        <input type="text" id="channelName" placeholder="e.g. Company A Channel">
      </div>
      <button class="submit" id="createBtn">Create channel</button>
      <div class="message" id="messageBox" hidden></div>
    </section>

    <section class="card" id="listCard" hidden>
      <h2>Active channels</h2>
      <div id="channelList"></div>
    </section>
  </main>

  <script>
    let db = null;

    function showPageError(text) {
      document.getElementById("statusText").hidden = true;
      const box = document.getElementById("pageError");
      box.textContent = text;
      box.hidden = false;
    }

    function showMessage(text, isError) {
      const box = document.getElementById("messageBox");
      box.textContent = text;
      box.className = "message " + (isError ? "error" : "success");
      box.hidden = false;
    }

    // Is the signed-in user a supervising professor or an employment place?
    async function canManageChannels(userId) {
      const [prof, place] = await Promise.all([
        db.from("supervisingprofessor").select("professor_id").eq("user_id", userId).maybeSingle(),
        db.from("employmentplace").select("place_id").eq("user_id", userId).maybeSingle()
      ]);
      if (prof.error) console.error(prof.error);
      if (place.error) console.error(place.error);
      return Boolean(prof.data || place.data);
    }

    async function loadCompanies() {
      const select = document.getElementById("placeName");
      const { data, error } = await db.from("employmentplace").select("place_name").order("place_name");
      if (error) {
        console.error(error);
        select.innerHTML = '<option value="">Companies could not be loaded</option>';
        return;
      }
      select.innerHTML = '<option value="">Select a company</option>';
      data.forEach((row) => {
        const option = document.createElement("option");
        option.value = row.place_name;
        option.textContent = row.place_name;
        select.appendChild(option);
      });
    }

    async function loadChannels() {
      const list = document.getElementById("channelList");
      const { data, error } = await db
        .from("companychannel")
        .select("channel_name, place_name, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        list.textContent = "Channels could not be loaded. Please try again later.";
        return;
      }
      list.innerHTML = "";
      if (data.length === 0) {
        list.textContent = "No channels yet.";
        return;
      }
      data.forEach((row) => {
        const item = document.createElement("div");
        item.className = "channel-item";
        const name = document.createElement("strong");
        name.textContent = row.channel_name;
        const place = document.createElement("span");
        place.textContent = " (" + row.place_name + ")";
        item.append(name, place);
        list.appendChild(item);
      });
    }

    async function createChannel() {
      const channelName = document.getElementById("channelName").value.trim();
      const placeName = document.getElementById("placeName").value;
      const btn = document.getElementById("createBtn");

      if (!channelName) { showMessage("Please enter a channel name.", true); return; }
      if (!placeName) { showMessage("Please select a valid company.", true); return; }

      btn.disabled = true;
      try {
        // place_name must exist in EmploymentPlace
        const { data: place, error: placeError } = await db
          .from("employmentplace").select("place_name").eq("place_name", placeName).maybeSingle();
        if (placeError) throw placeError;
        if (!place) { showMessage("Please select a valid company.", true); return; }

        // One channel per company
        const { data: existing, error: existingError } = await db
          .from("companychannel").select("channel_id").eq("place_name", placeName);
        if (existingError) throw existingError;
        if (existing.length > 0) { showMessage("This company already has a channel.", true); return; }

        const { error } = await db.from("companychannel").insert({ channel_name: channelName, place_name: placeName });
        if (error) {
          console.error(error);
          // 42501 = blocked by a row-level security policy
          showMessage(error.code === "42501"
            ? "You can only create channels for companies you supervise."
            : "The channel could not be created. Please try again later.", true);
          return;
        }

        showMessage('Channel "' + channelName + '" created.', false);
        document.getElementById("channelName").value = "";
        document.getElementById("placeName").value = "";
        loadChannels();
      } catch (err) {
        console.error(err);
        showMessage("The channel could not be created. Please try again later.", true);
      } finally {
        btn.disabled = false;
      }
    }

    async function init() {
      if (typeof SUPABASE_URL === "undefined" || typeof SUPABASE_ANON_KEY === "undefined" || !window.supabase) {
        showPageError("This page cannot connect to the database right now. Please try again later.");
        return;
      }
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      try {
        const { data: { user } } = await db.auth.getUser();
        if (!user) {
          document.getElementById("statusText").innerHTML =
            'You are not signed in. <a href="index.html">Sign in</a> to see company channels.';
          return;
        }

        document.getElementById("statusText").hidden = true;
        document.getElementById("listCard").hidden = false;

        // Students see only the list. Professors and companies also see the form.
        if (await canManageChannels(user.id)) {
          document.getElementById("createCard").hidden = false;
          document.getElementById("createBtn").addEventListener("click", createChannel);
          loadCompanies();
        }
        loadChannels();
      } catch (err) {
        console.error(err);
        showPageError("Company channels could not be loaded. Please try again later.");
      }
    }

    init();

    // Side menu
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    function openSidebar() { sidebar.classList.add("open"); overlay.classList.add("active"); }
    function hideSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("active"); }
    document.getElementById("menuToggle").addEventListener("click", openSidebar);
    document.getElementById("closeSidebar").addEventListener("click", hideSidebar);
    overlay.addEventListener("click", hideSidebar);
  </script>
</body>
</html>
